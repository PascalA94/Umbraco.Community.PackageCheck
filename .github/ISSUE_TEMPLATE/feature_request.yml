name: Feature request
description: Suggest a new check, option or report change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
    validations:
      required: true
  - type: textarea
    id: packages
    attributes:
      label: Example packages
      description: Public package ids and versions that show the case, if any
