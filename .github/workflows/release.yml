name: Release

# Runs on a version tag (v0.1.0-rc.1, v0.1.0). Builds, tests, packs with the tag's version, pushes to nuget.org with
# trusted publishing (a short-lived key from GitHub OIDC, so no long-lived key is stored) and creates the GitHub release,
# marked prerelease when the version has a suffix.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Security review M4-S2: only a commit that is already on main can be published.
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $TAG is not v<semver>" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build --filter-not-trait "Category=Golden"
      - run: dotnet pack src/PackageCheck.Cli -c Release -p:Version="${{ steps.version.outputs.version }}" -o artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: artifacts/*
          retention-days: 30

  publish:
    needs: build-test-pack
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in the repo settings to gate every publish by hand.
    environment: nuget
    permissions:
      contents: write # the GitHub release
      id-token: write # trusted publishing to nuget.org
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: artifacts
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build-test-pack.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" artifacts/*.nupkg artifacts/*.snupkg --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" --notes "See CHANGELOG.md for $VERSION." "${prerelease[@]}"
